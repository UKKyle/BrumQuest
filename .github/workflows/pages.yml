name: Deploy BrumQuest to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Generate iPhone and PWA PNG icons
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont

          def make(size, path):
              img = Image.new('RGBA', (size, size), (23, 25, 23, 255))
              draw = ImageDraw.Draw(img)
              draw.rectangle(
                  (int(size * .12), int(size * .69), int(size * .88), int(size * .86)),
                  fill=(11, 107, 130, 255)
              )
              radius = int(size * .095)
              cx, cy = int(size * .74), int(size * .24)
              draw.ellipse(
                  (cx - radius, cy - radius, cx + radius, cy + radius),
                  fill=(255, 107, 53, 255)
              )
              try:
                  font = ImageFont.truetype(
                      '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',
                      int(size * .31)
                  )
              except Exception:
                  font = ImageFont.load_default()
              box = draw.textbbox((0, 0), 'BQ', font=font)
              width = box[2] - box[0]
              height = box[3] - box[1]
              draw.text(
                  ((size - width) / 2, size * .39 - height / 2),
                  'BQ',
                  font=font,
                  fill=(247, 247, 245, 255)
              )
              img.save(path)

          make(180, 'apple-touch-icon.png')
          make(192, 'icon-192.png')
          make(512, 'icon-512.png')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
